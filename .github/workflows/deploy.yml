name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        # Sadece testleri calistiriyoruz. Veritabanina ihtiyac duyan testler varsa 
        # (orn. integration tests), mock'lanmis olmalidir veya GitHub Actions 
        # uzerinde servisler (Postgres) tanimlanmalidir. 
        # Simdilik var olan testleri calistiririz.
        run: |
          pytest tests/

  deploy:
    name: Deploy to VPS
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: SSH and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/ubuntu/chat-bot
            git fetch origin
            git reset --hard origin/main || git reset --hard origin/master
            docker compose -f docker-compose.prod.yml up -d --build api
